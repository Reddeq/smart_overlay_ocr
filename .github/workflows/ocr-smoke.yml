name: OCR smoke tests
on:
  push:
    branches:
      - refactor/one-click-smart-ocr
  workflow_dispatch:
jobs:
  multilingual:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke-test dependencies (no model downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2,<3" "numpy>=1.26" pillow "opencv-python-headless>=4.8" httpx PySide6 pytest
      - name: Syntax checks
        run: python -m compileall -q smart_overlay tests
      - name: Multilingual and one-click contracts
        run: python -m pytest -q tests/test_languages.py tests/test_one_click.py
