name: OCR smoke tests
on:
  push:
    branches:
      - refactor/one-click-smart-ocr
      - feature/native-drawing-conversion
  workflow_dispatch:
jobs:
  multilingual:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries for offscreen PySide6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0
      - name: Install smoke-test dependencies (no model downloads)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2,<3" "numpy>=1.26" pillow "opencv-python-headless>=4.8" "PyMuPDF>=1.26.4,<2" httpx PySide6 pytest
      - name: Install PPTX generator for native PDF integration test
        run: npm install --no-save --ignore-scripts --package-lock=false pptxgenjs@4.0.1
      - name: Syntax checks
        run: python -m compileall -q smart_overlay tests
      - name: Multilingual, one-click and local VL contracts (mocked engine)
        run: python -m pytest -q tests/test_languages.py tests/test_one_click.py tests/test_vl_local.py tests/test_vl_tiled.py tests/test_vl_detect.py tests/test_vl_hybrid.py tests/test_ocr_ensemble.py tests/test_cloud_ocr.py tests/test_native_pdf.py
